<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream</title>
    <style>
        body { font-family: Arial; text-align: center; background: #000; color: #fff; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 900px; background: #222; border-radius: 8px; }
        .stats { background: #e74c3c; padding: 5px 15px; border-radius: 20px; display: inline-block; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="stats">👁 Live Viewers: <span id="viewCount">0</span></div>
    <br>
    <video id="video" autoplay playsinline controls></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = io.connect(window.location.origin);
        const video = document.getElementById("video");
        let peerConnection;
        const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        socket.on("viewer-count", count => {
            document.getElementById("viewCount").innerText = Math.max(0, count);
        });

        socket.on("offer", (id, description) => {
            peerConnection = new RTCPeerConnection(config);
            peerConnection.setRemoteDescription(description)
                .then(() => peerConnection.createAnswer())
                .then(sdp => peerConnection.setLocalDescription(sdp))
                .then(() => socket.emit("answer", id, peerConnection.localDescription));

            peerConnection.ontrack = event => {
                video.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) socket.emit("candidate", id, event.candidate);
            };
        });

        socket.on("broadcaster", () => {
            socket.emit("watcher");
        });

        window.onunload = window.onbeforeunload = () => {
            socket.close();
            if(peerConnection) peerConnection.close();
        };

        // Emit watcher event when joining
        socket.emit("watcher");
    </script>
</body>
</html>
