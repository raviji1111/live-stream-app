<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Live Stream</title>
    <style>
        body { font-family: Arial; text-align: center; background: #111; color: white; }
        video { width: 80%; max-width: 800px; border: 2px solid #4CAF50; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 18px; background: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Admin: Start Screen Share</h2>
    <button id="startBtn">Start Live Stream</button><br>
    <video id="video" autoplay muted playsinline></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io.connect(window.location.origin);
        const peerConnections = {};
        const videoElement = document.getElementById("video");
        let localStream;

        const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                // Phone/PC se screen capture request karega
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                videoElement.srcObject = localStream;
                socket.emit("broadcaster");
            } catch (err) {
                alert("Screen share permission denied or not supported on this browser.");
            }
        });

        socket.on("watcher", id => {
            const peerConnection = new RTCPeerConnection(config);
            peerConnections[id] = peerConnection;

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.onicecandidate = event => {
                if (event.candidate) socket.emit("candidate", id, event.candidate);
            };

            peerConnection.createOffer()
                .then(sdp => peerConnection.setLocalDescription(sdp))
                .then(() => socket.emit("offer", id, peerConnection.localDescription));
        });

        socket.on("answer", (id, description) => {
            peerConnections[id].setRemoteDescription(description);
        });

        socket.on("candidate", (id, candidate) => {
            peerConnections[id].addIceCandidate(new RTCIceCandidate(candidate));
        });

        socket.on("disconnectPeer", id => {
            if (peerConnections[id]) {
                peerConnections[id].close();
                delete peerConnections[id];
            }
        });
    </script>
</body>
</html>
